# docker-compose.storage.yml
# 容器统一命名 PersonalRag-*；镜像优先复用本机已有(pgvector/redis/minio)，缺失的(etcd/milvus/neo4j)走 daocloud 加速拉取
services:
  postgres:
    container_name: PersonalRag-Postgres
    image: docker.m.daocloud.io/pgvector/pgvector:pg16   # 本机已有(PG16, 额外带pgvector扩展备用)
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: rag
    volumes: [pg_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped

  redis:
    container_name: PersonalRag-Redis
    image: redis:7-alpine                                # 本机已有
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped

  etcd:
    container_name: PersonalRag-Etcd
    image: quay.io/coreos/etcd:v3.5.5   # daocloud 的 quay 代理 403, 改直连(本机实测可拉)
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcd_data:/etcd]
    restart: unless-stopped

  minio:
    container_name: PersonalRag-MinIO
    image: minio/minio:latest                            # 本机已有; 若 Milvus 启动异常可固定为 RELEASE.2023-03-20T20-16-18Z
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 15s, timeout: 5s, retries: 5}
    restart: unless-stopped

  milvus:
    container_name: PersonalRag-Milvus
    image: docker.m.daocloud.io/milvusdb/milvus:v2.4.0   # 本机没有, 首次启动需拉取
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes: [milvus_data:/var/lib/milvus]
    ports: ["19530:19530", "9091:9091"]
    depends_on: [etcd, minio]
    restart: unless-stopped

  # Neo4j 可选（法规引用图谱，三期再启）
  neo4j:
    container_name: PersonalRag-Neo4j
    image: docker.m.daocloud.io/library/neo4j:5          # 本机没有, 三期启用时再拉取
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes: [neo4j_data:/data]
    ports: ["7687:7687", "7474:7474"]
    restart: unless-stopped
    profiles: ["graph"]      # 只在需要时: docker compose --profile graph up -d

volumes:
  pg_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
